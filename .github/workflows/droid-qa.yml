name: Droid QA Validator

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: droid-qa-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.head.repo.full_name == github.repository && (
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request != null &&
         contains(github.event.comment.body, '@droid qa')) ||
        (github.event_name == 'pull_request' &&
         github.event.action == 'labeled' &&
         github.event.label.name == 'qa')
      )
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Droid CLI
        run: |
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/droid" --version

      - name: Setup custom droids
        run: |
          mkdir -p ~/.factory/droids
          if [ -d .factory/droids ]; then
            cp -r .factory/droids/* ~/.factory/droids/
          fi

      - name: Run QA validation
        run: |
          PR_NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"

          droid exec \
            --auto low \
            --restrict-tools Read,LS,Grep,Glob,Execute \
            --tag qa-validator \
            --tag "{\"name\":\"pr\",\"value\":\"$PR_NUMBER\"}" \
            "Run QA validation on the portfolio site for PR #$PR_NUMBER.

          Follow the procedure in .factory/droids/qa-validator.md:
          1. Start the Vite dev server: npm run dev (port 3000)
          2. Open http://127.0.0.1:3000 in a browser
          3. Verify the homepage graph renders with nodes
          4. Click a node and verify its content page loads
          5. Test the mobile graph/content toggle
          6. Inspect window.__portfolio for data source and node count
          7. Run accessibility checks
          8. Check the browser console for errors
          9. Stop the dev server and close the browser

          Post the results as a PR comment using:
          gh pr comment $PR_NUMBER --body-file <report-file>

          Never leave servers or browser sessions running after the check.
          Run only one browser session at a time."
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
