name: Droid Dashboard Observer

on:
  schedule:
    - cron: '0 9 * * 1'  # Weekly on Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: read
  id-token: write

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Droid CLI
        run: |
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/droid" --version

      - name: Setup custom droids
        run: |
          mkdir -p ~/.factory/droids
          if [ -d .factory/droids ]; then
            cp -r .factory/droids/* ~/.factory/droids/
          fi

      - name: Generate fleet dashboard summary
        run: |
          # Gather recent PR and run data for the agent
          REPO="${{ github.repository }}"
          PRS=$(gh pr list --repo "$REPO" --state all --limit 30 --json number,title,state,mergedAt,closedAt 2>/dev/null || echo '[]')
          RUNS=$(gh run list --repo "$REPO" --limit 50 --json databaseId,name,conclusion,createdAt,workflowName 2>/dev/null || echo '[]')

          droid exec \
            --auto low \
            --restrict-tools Read,LS,Grep,Glob,Execute \
            --tag dashboard-observer \
            --append-system-prompt "You are the Dashboard Observer agent. Produce a read-only fleet activity summary using the GitHub data provided. Never write to branches, approve PRs, or merge. Post the summary as a comment on the most recent open issue labeled 'fleet-dashboard', or create one if none exists." \
            "Generate a weekly fleet dashboard summary for repository $REPO.

          Recent pull requests (last 30):
          $PRS

          Recent workflow runs (last 50):
          $RUNS

          Summarize:
          - PRs opened, merged, and closed
          - Workflow runs by name and conclusion (success/failure)
          - Any Droid agent workflow runs and their outcomes
          - Notable patterns or issues

          Post the summary as a comment on an issue labeled 'fleet-dashboard'
          using gh CLI. If no such issue exists, create one:
          gh issue create --repo $REPO --label fleet-dashboard --title 'Fleet Dashboard' --body-file <summary-file>"
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
