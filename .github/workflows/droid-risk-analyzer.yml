name: Droid Risk Analyzer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: droid-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk-analysis:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for CI checks
        run: |
          # Wait up to 10 minutes for CI checks to complete
          timeout 600 gh pr checks ${{ github.event.pull_request.number }} --watch --interval 30 || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Droid CLI
        run: |
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/droid" --version

      - name: Setup custom droids
        run: |
          mkdir -p ~/.factory/droids
          if [ -d .factory/droids ]; then
            cp -r .factory/droids/* ~/.factory/droids/
          fi

      - name: Run risk analysis
        id: risk
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_HEAD="${{ github.event.pull_request.head.sha }}"
          PR_BASE="${{ github.event.pull_request.base.sha }}"

          # Get check status
          CHECKS_JSON=$(gh pr checks "$PR_NUMBER" --json name,state 2>/dev/null || echo '[]')
          DIFF_STAT=$(git diff --stat "$PR_BASE" "$PR_HEAD" | tail -1)
          DIFF_LINES=$(git diff --shortstat "$PR_BASE" "$PR_HEAD" | grep -oP '\d+' | paste -sd+ | bc || echo 0)

          # Get changed files
          CHANGED_FILES=$(git diff --name-only "$PR_BASE" "$PR_HEAD")

          # Build the prompt
          cat > /tmp/risk-prompt.txt << 'PROMPT_EOF'
          Analyze the risk of this pull request using the risk taxonomy in
          docs/agent-fleet/RISK_TAXONOMY.md.

          PR number: PR_NUMBER
          Head SHA: PR_HEAD
          Base SHA: PR_BASE

          Diff stat: DIFF_STAT
          Total changed lines: DIFF_LINES

          Changed files:
          CHANGED_FILES

          CI check status:
          CHECKS_JSON

          Steps:
          1. Read docs/agent-fleet/RISK_TAXONOMY.md and docs/agent-fleet/SENSITIVE_PATHS.md
          2. Check if any changed files match sensitive path patterns
          3. Count the diff lines
          4. Check if any dependencies, SQL, workflows, or auth files changed
          5. Determine if all CI checks are passing
          6. Classify the risk as low, medium, or high
          7. Post a comment on the PR with the machine-readable JSON assessment
             and a human-readable summary

          If the risk is low and all required checks pass, approve the PR.
          If the risk is medium or high, do not approve.

          Use the risk-analyzer subagent for the analysis.

          Post the assessment as a PR comment using gh CLI:
          gh pr comment PR_NUMBER --body-file <comment-file>
          PROMPT_EOF

          # Substitute variables
          sed -i "s|PR_NUMBER|$PR_NUMBER|g" /tmp/risk-prompt.txt
          sed -i "s|PR_HEAD|$PR_HEAD|g" /tmp/risk-prompt.txt
          sed -i "s|PR_BASE|$PR_BASE|g" /tmp/risk-prompt.txt
          sed -i "s|DIFF_STAT|$DIFF_STAT|g" /tmp/risk-prompt.txt
          sed -i "s|DIFF_LINES|$DIFF_LINES|g" /tmp/risk-prompt.txt
          sed -i "s|CHANGED_FILES|$CHANGED_FILES|g" /tmp/risk-prompt.txt
          sed -i "s|CHECKS_JSON|$CHECKS_JSON|g" /tmp/risk-prompt.txt

          droid exec \
            --auto low \
            --restrict-tools Read,LS,Grep,Glob,Execute \
            -f /tmp/risk-prompt.txt \
            --output-format json \
            --tag risk-analyzer \
            --tag "{\"name\":\"pr\",\"value\":\"$PR_NUMBER\"}"
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
